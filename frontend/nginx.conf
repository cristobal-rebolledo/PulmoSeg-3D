# ===========================================================================
# nginx.conf — Configuración Nginx para PulmoSeg-3D Frontend
#
# Responsabilidades:
#   1. Servir el SPA React con fallback a index.html (React Router)
#   2. Proxy transparente de /api/ → http://backend:8000/
#      (elimina el prefijo /api, replicando el comportamiento del proxy Vite)
#   3. Soporte para uploads DICOM grandes (hasta 512 MB)
#   4. Headers de seguridad básicos
# ===========================================================================

server {
    listen 80;
    server_name _;

    # -------------------------------------------------------------------------
    # Raíz del SPA
    # -------------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Compresión Gzip — mejora tiempo de carga del bundle React
    # -------------------------------------------------------------------------
    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;
    gzip_min_length 1024;

    # -------------------------------------------------------------------------
    # Headers de seguridad
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Proxy /api/ → Backend FastAPI
    # -------------------------------------------------------------------------
    # La barra al final de proxy_pass elimina el prefijo /api del path:
    #   /api/health       → http://backend:8000/health
    #   /api/segment      → http://backend:8000/segment
    #   /api/status/{id}  → http://backend:8000/status/{id}
    #   /api/nifti/{id}   → http://backend:8000/nifti/{id}
    #   /api/volume/{id}  → http://backend:8000/volume/{id}
    #   /api/dicom/{id}/  → http://backend:8000/dicom/{id}/
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;

        # Headers estándar de proxy reverso
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts extendidos para uploads DICOM y jobs de segmentación largos.
        # La inferencia con MONAI puede tardar varios minutos en CPU.
        proxy_connect_timeout  60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Tamaño máximo de body para uploads DICOM (estudios de 200-500 MB)
        client_max_body_size  512M;

        # Deshabilitar buffering de respuesta para streaming de progreso
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # Assets estáticos — cache agresivo (fingerprint en el nombre del archivo)
    # -------------------------------------------------------------------------
    location ~* \.(js|css|wasm|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # SPA fallback — todas las rutas sirven index.html (React Router)
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Health check de Nginx (para Docker HEALTHCHECK si se necesita)
    # -------------------------------------------------------------------------
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
